name: Website Health & Code Quality

# Fast health checks run on pushes and PRs to verify linting, type safety, and build integrity.
on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, Type Check & Build Health
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ESLint Code Quality Check
        run: npm run lint

      - name: TypeScript Type Safety Check
        run: npx tsc --noEmit

      - name: Next.js Production Build Health
        run: npm run build
